name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: keep every script in this file ASCII-only. Windows PowerShell 5.1 reads the
      # temporary script as ANSI, so non-ASCII text turns into garbage and breaks parsing.
      - name: PowerShell syntax check
        shell: powershell
        run: |
          $bad = 0
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | Where-Object { $_.FullName -notmatch '[\\/]vendor[\\/]' }
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) {
              Write-Host ("::error file={0},line={1}::{2}" -f $f.FullName, $e.Extent.StartLineNumber, $e.Message)
              $bad++
            }
          }
          Write-Host ("Files checked: {0}, errors: {1}" -f @($files).Count, $bad)
          if ($bad -gt 0) { exit 1 }

      - name: Core self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\selftest.ps1

      - name: VERSION matches CHANGELOG
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $h = (Select-String -Path CHANGELOG.md -Pattern '^## (\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "VERSION=$v, CHANGELOG=$h"
          if ($v -ne $h) { Write-Error "VERSION and the top CHANGELOG.md entry differ"; exit 1 }

      - name: Fake payload tool self-check
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python tools/payload_tool.py selfcheck

      - name: Generated files match the generators
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python tools/gen_strategies.py
          python tools/payload_tool.py report
          git diff --exit-code -- strategies/norma docs/OPTIONS.md docs/PAYLOADS.md app/core/checksums.txt THIRD_PARTY_NOTICES.md
