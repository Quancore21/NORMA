name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка синтаксиса PowerShell
        shell: powershell
        run: |
          $bad = 0
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | Where-Object { $_.FullName -notmatch '[\\/]vendor[\\/]' }
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) {
              Write-Host ("::error file={0},line={1}::{2}" -f $f.FullName, $e.Extent.StartLineNumber, $e.Message)
              $bad++
            }
          }
          Write-Host ("Проверено файлов: {0}, ошибок: {1}" -f @($files).Count, $bad)
          if ($bad -gt 0) { exit 1 }

      - name: Самопроверка ядра
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\selftest.ps1

      - name: Версия совпадает с журналом изменений
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $h = (Select-String -Path CHANGELOG.md -Pattern '^## (\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "VERSION=$v, CHANGELOG=$h"
          if ($v -ne $h) { Write-Error "VERSION и верхняя запись CHANGELOG.md не совпадают"; exit 1 }

      - name: Стратегии NORMA соответствуют генератору
        shell: bash
        run: |
          python tools/gen_strategies.py
          git diff --exit-code -- strategies/norma
