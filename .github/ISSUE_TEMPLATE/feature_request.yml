name: Идея / Feature request
description: Предложить улучшение или новую стратегию
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что предлагаете
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Какую задачу это решает
  - type: input
    id: isp
    attributes:
      label: Провайдер и регион (для новых стратегий)
